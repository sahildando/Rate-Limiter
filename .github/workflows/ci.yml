name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
          POSTGRES_DB: monitoring_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://monitoring:monitoring@localhost:5433/monitoring_test
      REDIS_URL: redis://localhost:6380/1
      JWT_SECRET: ci-test-secret-key-with-sufficient-length
      RATE_LIMIT_ANONYMOUS_PER_MINUTE: 10000
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: 10000
      RATE_LIMIT_LOGIN_PER_MINUTE: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app

      - name: MyPy type check
        run: mypy app

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -v

      - name: Build Docker image
        run: docker build -t api-monitoring-backend:ci .

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
